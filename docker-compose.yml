services:
  dailydig:
    # Option A (default): build from the source in this folder.
    build: .
    # Option B: use the prebuilt image published by GitHub Actions (comment out `build` above).
    # image: ghcr.io/YOUR_GITHUB_USER/dailydig:latest
    container_name: dailydig
    restart: unless-stopped
    ports:
      - "8090:8090"
    env_file: .env
    environment:
      DD_CONFIG_DIR: /config
      DD_MUSIC_DIR: /music
    volumes:
      - ./config:/config
      # Your music library (the same folder Navidrome scans). DailyDig adds new tracks here, laid out
      # like the rest of the library, and writes playlists to /music/_Playlists.
      - /path/to/your/music:/music
    mem_limit: 512m
